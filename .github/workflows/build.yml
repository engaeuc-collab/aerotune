name: Build AeroTune

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest,  extra: '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' }
          - { name: Linux,   os: ubuntu-latest }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: DSP self-test (no JUCE)
        if: runner.os != 'Windows'
        run: |
          g++ -std=c++17 -O2 -ISource/DSP tests/engine_test.cpp -o engine_test || c++ -std=c++17 -O2 -ISource/DSP tests/engine_test.cpp -o engine_test
          ./engine_test

      - name: Configure
        shell: bash
        env:
          EXTRA: ${{ matrix.extra }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${EXTRA:+"$EXTRA"}

      - name: Build VST3
        run: cmake --build build --config Release --target AeroTune_VST3 --parallel 4

      - name: Package
        working-directory: build/AeroTune_artefacts/Release/VST3
        run: cmake -E tar cf ../../../../AeroTune-${{ matrix.name }}-VST3.zip --format=zip AeroTune.vst3

      - uses: actions/upload-artifact@v4
        with:
          name: AeroTune-${{ matrix.name }}-VST3
          path: AeroTune-${{ matrix.name }}-VST3.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
